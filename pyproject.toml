[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-opf"
version = "0.1.0"
description = "Fuzzy Optimum-Path Forest (Python port of LibOPF_fuzzy), built on opfython + opytimizer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Renato W. R. de Souza" },
]
dependencies = [
  "opfython>=2.0.2",
  "opytimizer>=4.1.0",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "typing_extensions>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

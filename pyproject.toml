[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fuzzy-opf"
version = "0.1.0"
description = "Fuzzy Optimum-Path Forest (Python port of LibOPF_fuzzy), built on opfython + opytimizer."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Renato W. R. de Souza" },
]
dependencies = [
  "opfython>=2.0.2",
  # Migrated to opytimizer 5.x on 2026-09-23 (see BACKLOG.md): the only
  # breaking change affecting this project was Opytimizer.start()'s
  # signature (n_iterations=N -> stopping_criteria=MaxIterations(N),
  # imported from opytimizer.core.stopping). Every search method
  # (GA/PSO/DE/GWO/NSGA2) was re-tested against 5.0.1 before this pin was
  # raised.
  "opytimizer>=5.0.0",
  "optuna>=4.0.0",
  "scipy>=1.11",
  "scikit-fuzzy>=0.4",
  "numpy>=1.24",
  "pyyaml>=6.0",
  "typing_extensions>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "pandas>=2.0",
  "statys>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

dataset: data/raw/data2.dat
n_runs: 20
seed: 0
search_best_k: false
membership_side: target

# n_train ~169 (60% de 283) -> k_max_bounds reduzido em relação ao padrão
# (150) para ficar com folga segura abaixo do tamanho do treino.
tuning:
  method: ga
  k_max_bounds: [1, 100]
  n_agents: 15
  n_iterations: 30

dataset: data/raw/mpeg7_BAS.dat
n_runs: 20
seed: 0
search_best_k: false
membership_side: target

# 1400 amostras, 180 atributos, 70 classes -- maior e mais dimensional que
# os outros datasets pequenos (mais parecido com um "Thyroid pequeno" em
# custo). n_train ~840 (60%), k_max_bounds completo do artigo cabe com
# folga.
tuning:
  method: ga
  k_max_bounds: [1, 150]
  n_agents: 15
  n_iterations: 30
